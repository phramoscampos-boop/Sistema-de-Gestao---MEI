<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Sistema de Gestão - MEI</title>
  </head>
  <body class="body-index">
    <main class="pagina-login">
      <section class="apresentacao">
        <img class="logo-mei" src="logo-mei-v2.svg" alt="Logo da MEI Gestão">
        <h1>Sistema de Gestão - MEI</h1>
        <p>Gerencie seu fluxo de clientes e atividades de forma eficiente.</p>
        <img class="ilustracao-calendario" src="calendario.svg" alt="Ilustração de calendário e organização de tarefas">
      </section>

      <section class="area-login">
        <form class="login" id="form-login">
          <h2>Login</h2>
          <p>Por favor, insira seu email e sua senha.</p>

          <label for="email-login" class="form-label-login">
            e-mail:
            <input required type="email" name="email" id="email-login" placeholder="seuemail@empresa.com" class="credencial">
          </label>

          <label for="password-login" class="form-label-login">
            senha:
            <input required type="password" name="password" id="password-login" placeholder="1234567" class="credencial">
          </label>

          <button type="submit" class="btn-login">Salvar</button>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
