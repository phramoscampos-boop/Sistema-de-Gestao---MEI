<!---->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="dashboard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Sistema de Gestão - MEI</title>
  </head>
  <body class="body-dashboard">
    <main>

      <div class="home_page">
        <div class="side_bar"> <!--side bar-->
          <img onclick="voltarHome()" class="voltarHome-class" id="voltarHome" src="arrow-voltar-home.svg" alt="Voltar para a página inicial.">
          <h2 class="voltarHome-text">Voltar para a página inicial</h2>
          <h1 class="elis">Elis</h1>
          <h1 class="la_belle">la Belle</h1>
        </div>

        <div class="home_cadastrar">
          <button class="cadastrar_clientes" id="abrir_CadastroCliente">
              <span class="bt_cadastrar_clientes">+</span>
              <span class="bt_clientes">Cadastrar clientes</span>
          </button>

          <button class="cadastrar_servicos">
              <span class="bt_cadastrar_servicos">+</span>
              <span class="bt_servicos">Cadastrar serviços</span>
          </button>
        </div>

      <div class="profile_container"> 
        
        <div class="profile" id="profile">
          <img class="profile_img" id="open_profile" src="profile_img.svg">
          <span class="profile_arrow">
            <img class = "profile_arrow_img" src="arrow_profile.svg" alt="Seta de mais informações sobre perfil.">
            <!--Troquei a setinha v pra uma imagem de setinha, depois vc aumenta o tamanho no css-->
          </span> <!-- Troquei o h1 por um span -->
        </div>
        
                  <!--Tela de perfil-->
        <div id="modalProfile" class="profile_info">
          <h1>Meu Perfil</h1>

          <div class="profile_data">
            <label>Nome</label>
            <p>Elis</p>
          </div>

          <div class="profile_data">
            <label>E-mail</label>
            <p>elislabelle@email.com</p>
          </div>

          <div class="profile_data">
            <label>Telefone</label>
            <p>+55 (77)0000-0000</p>
          </div>
        
        </div>
        
      </div> 

        <div class="dashboard_busca">
        </div>

      </div>
        <div class="cadastro_cliente" id="cadastro_cliente">
          <div class="cadastro-content">
            <span class="closeCadCli" id="closeCadCli">&times;</span>

            <h2>Cadastro > Clientes</h2>
            <form action="" class="form-cadastro-cliente">
              <label for="nome" >Nome: </label>
              <input 
                required type="nome" 
                name="nome" 
                id="nome-cad-cliente" 
                class="style_cad-cliente">
              
              <br><label for="telefone" >Telefone: </label>
              <input 
                required type="telefone" 
                name="telefone" 
                id="telefone-cad-cliente" 
                placeholder="(xx) 9xxxx-xxxx"
                maxlength="15"
                class="style_cad-cliente">
              
              <br><label for="nasc" >Data de nascimento: </label>
              <input 
                type="nasc" 
                name="nasc" 
                id="nasc-cad-cliente" 
                placeholder="dd/mm/aaaa"
                maxlength="10"
                class="style_cad-cliente">
              
              <br><label for="cep" >CEP: </label>
              <input 
                type="cep" 
                name="cep" 
                id="cep-cad-cliente" 
                placeholder="xxxxx-xxx"
                maxlength="9"
                class="style_cad-cliente">

              <button class="bt_cadastrar" id="bt_cadastrar">Cadastrar</button>
            </form>
          </div>

        </div>

    </main>
    <script src="https://unpkg.com/scrollreveal"></script>
    <script src="dashboard_script.js"></script>
  </body>
</html>
