<!---->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="dashboard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Sistema de Gestão - MEI</title>
  </head>
  <body class="body-dashboard">
    <main>

      <div> <!--HOME PAGE-->

        <div class="side_bar"> <!--side bar-->
          <h1 class="elis">Elis</h1>
          <h1 class="la_belle">la Belle</h1>
        </div>

        <div class="home_cadastrar">
          <button class="cadastrar_clientes">
              <span class="bt_cadastrar_clientes">+</span>
              <span class="bt_clientes">Cadastrar clientes</span>
          </button>

          <button class="cadastrar_servicos">
              <span class="bt_cadastrar_servicos">+</span>
              <span class="bt_servicos">Cadastrar serviços</span>
          </button>
        </div>
      </div>

      <div class="profile" id="bt_profile">
        <img class="profile_img" src="profile_img.svg">
        <span class="profile_arrow">v</span> <!-- Troquei o h1 por um span -->
      
        <!--Tela de perfil-->
        <div class=""></div>
      </div>

      <div class="cadastro_cliente" id="cadastro_cliente">
        <div class="cadastro-content">
          <span class="closeCadCli" id="closeCadCli">&times;</span>

          <h2>Cadastro > Clientes</h2>
          <form action="" class="form-cadastro-cliente">
            <label for="nome" >Nome: </label>
            <input required type="nome" name="nome" id="nome-cad-cliente" class="style_cad-cliente">
            <label for="telefone" >Telefone: </label>
            <input required type="telefone" name="telefone" id="telefone-cad-cliente" placeholder="(xx) 9xxxx-xxxx" class="style_cad-cliente">
            <label for="nasc" >Data de nascimento: </label>
            <input required type="nasc" name="nasc" id="nasc-cad-cliente" placeholder="dd/mm" class="style_cad-cliente">

          </form>
        </div>

      </div>

      <div class="dashboard_busca">
      </div>

    </main>
    <script src="script.js"></script>
    <script src="dashboard_script"></script>
  </body>
</html>
