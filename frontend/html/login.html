<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sistema de Gestão - MEI</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="icon" type="image/png" href="../assets/images/logo-mei-v2.svg" />

  </head>
  <body class="tela-login">
    <main class="pagina-login">
      <section class="boas-vindas">
        <img class="logo" src="../assets/images/logo-mei-v2.svg" alt="Logo da MEI Gestão">
        <h1>Sistema de Gestão - MEI</h1>
        <p>Gerencie seu fluxo de clientes e atividades de forma eficiente.</p>
        <img class="ilustracao" src="../assets/images/calendario.svg" alt="Ilustração de calendário e organização de tarefas">
      </section>

      <section class="acesso">
        <form class="login" id="form-login" method="post" novalidate>
          <h2>Login</h2>
          <p>Por favor, insira seu email e sua senha.</p>

          <label for="email-login" class="campo-login">
            e-mail:
            <input type="email" name="email" id="email-login" required placeholder="seuemail@empresa.com" class="credencial">
          </label>

          <label for="password-login" class="campo-login">
            senha:
            <input type="password" name="password" id="password-login" required placeholder="1234567" class="credencial">
          </label>
          <p id="mensagem-erro" class="mensagem-erro"></p>

          <button type="submit" class="botao-login">Entrar</button>
          <a class="link-troca-senha" href="/html/alterar-senha.html">Trocar senha</a>
        </form>
      </section>
    </main>
    <script src="../javascript/login.js"></script>
  </body>
</html>
