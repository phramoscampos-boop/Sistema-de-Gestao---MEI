<!---->
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Sistema de Gestão - MEI</title>
  </head>
  <body class="body-dashboard">
    <main>

      <div class="home_page">
        <div class="side_bar"> <!--side bar-->
          <!-- O clique desta seta é configurado no arquivo dashboard_script.js. -->
          <img class="voltarHome-class" id="voltarHome" src="../assets/images/arrow-voltar-home.svg" alt="Voltar para a página inicial.">
          <h2 class="voltarHome-text">Voltar para a página inicial</h2>
          <h1 class="elis">Elis</h1>
          <h1 class="la_belle">la Belle</h1>
        </div>

        <div class="home_cadastrar">
          <button class="cadastrar_clientes" id="abrir_CadastroCliente">
              <span class="bt_cadastrar_clientes">+</span>
              <span class="bt_clientes">Cadastrar clientes</span>
          </button>

          <button class="cadastrar_servicos" id="abrir_CadastroServico" type="button">
              <span class="bt_cadastrar_servicos">+</span>
              <span class="bt_servicos">Cadastrar serviços</span>
          </button>
        </div>

      <div class="profile_container"> 
        
        <div class="profile" id="profile">
          <img class="profile_img" id="open_profile" src="../assets/images/profile_img.svg">
          <span class="profile_arrow">
            <img class = "profile_arrow_img" src="../assets/images/arrow_profile.svg" alt="Seta de mais informações sobre perfil.">
            <!--Troquei a setinha v pra uma imagem de setinha, depois vc aumenta o tamanho no css-->
          </span> <!-- Troquei o h1 por um span -->
        </div>
        
                  <!--Tela de perfil-->
        <div id="modalProfile" class="profile_info">
          <h1>Meu Perfil</h1>

          <div class="profile_data">
            <label>Nome</label>
            <p id="nome-usuario-dashboard">Elis</p>
          </div>

          <div class="profile_data">
            <label>E-mail</label>
            <p id="email-usuario-dashboard">elislabelle@email.com</p>
          </div>

          <div class="profile_data">
            <label>Telefone</label>
            <p>+55 (77)0000-0000</p>
          </div>

          <button type="button" id="botao-sair" class="botao-sair">Sair</button>
        </div>
        
      </div> 

        <section class="dashboard_busca" aria-labelledby="titulo-clientes">
          <h2 id="titulo-clientes">Clientes cadastrados</h2>
          <div id="lista-clientes" class="lista-clientes" aria-live="polite"></div>
        </section>

      </div>
        <div class="cadastro_cliente" id="cadastro_cliente" aria-hidden="true">
          <div class="cadastro-content">
            <button class="closeCadCli" id="closeCadCli" type="button" aria-label="Fechar cadastro">&times;</button>

            <h2>Cadastro &gt; Clientes</h2>
            <form class="form-cadastro-cliente" id="form-cadastro-cliente">
              <label for="nome-cad-cliente">Nome</label>
              <input required type="text" name="nome" id="nome-cad-cliente" class="style_cad-cliente" autocomplete="name">

              <label for="telefone-cad-cliente">Telefone</label>
              <input required type="tel" name="telefone" id="telefone-cad-cliente" placeholder="(xx) 9xxxx-xxxx" maxlength="15" class="style_cad-cliente" autocomplete="tel">

              <label for="nasc-cad-cliente">Data de nascimento</label>
              <input required type="date" name="dataNascimento" id="nasc-cad-cliente" class="style_cad-cliente">

              <label for="cep-cad-cliente">CEP</label>
              <input required type="text" name="cep" id="cep-cad-cliente" placeholder="xxxxx-xxx" maxlength="9" class="style_cad-cliente" inputmode="numeric" autocomplete="postal-code">

              <label for="servico-cad-cliente">Serviço escolhido</label>
              <select required name="servicoId" id="servico-cad-cliente" class="style_cad-cliente">
                <option value="">Carregando serviços...</option>
              </select>

              <p id="mensagem-erro-cliente" class="mensagem-dashboard erro-dashboard" role="alert"></p>
              <button class="bt_cadastrar" type="submit">Cadastrar cliente</button>
            </form>
          </div>
        </div>

        <div class="cadastro_cliente" id="cadastro_servico" aria-hidden="true">
          <div class="cadastro-content">
            <button class="closeCadCli" id="closeCadServico" type="button" aria-label="Fechar cadastro">&times;</button>
            <h2>Cadastro &gt; Serviços</h2>

            <form class="form-cadastro-cliente" id="form-cadastro-servico">
              <label for="nome-servico">Nome do serviço</label>
              <input required type="text" name="nome" id="nome-servico" class="style_cad-cliente">

              <label for="duracao-servico">Tempo para concluir (minutos)</label>
              <input required type="number" name="duracaoMinutos" id="duracao-servico" min="1" step="1" placeholder="Ex.: 60" class="style_cad-cliente">

              <label for="valor-servico">Valor de oferta (R$)</label>
              <input required type="number" name="valor" id="valor-servico" min="0.01" step="0.01" placeholder="Ex.: 80,00" class="style_cad-cliente">

              <p id="mensagem-erro-servico" class="mensagem-dashboard erro-dashboard" role="alert"></p>
              <button class="bt_cadastrar" type="submit">Cadastrar serviço</button>
            </form>

            <h3 class="titulo-servicos">Serviços cadastrados</h3>
            <div id="lista-servicos" class="lista-servicos" aria-live="polite"></div>
          </div>
        </div>

    </main>
    <script src="../javascript/dashboard_script.js"></script>
  </body>
</html>
